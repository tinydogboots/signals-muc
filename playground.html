<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AMD MÜNCHEN — Playground</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #111;
    --panel: #1b1b1b;
    --ink: #eee;
    --muted: #888;
    --accent: #6cf;
    --sel: #ff9;
    --border: #2a2a2a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.4 "Instrument Sans", "Plus Jakarta Sans", "Source Sans 3", -apple-system, "Helvetica Neue", sans-serif;
    font-weight: 400; font-stretch: 100%;
    display: grid;
    grid-template-columns: 1fr 340px;
    grid-template-rows: 100vh;
    overflow: hidden;
  }
  #canvas-wrap {
    background: #0a0a0a;
    padding: 24px;
    overflow: auto;
    position: relative;
    cursor: grab;
    user-select: none;
  }
  #canvas-wrap.dragging { cursor: grabbing; }
  #canvas-wrap.shape-drag { cursor: move; }
  #canvas {
    width: fit-content;
    margin: 0 auto;
    background: #f2f2f0;
    box-shadow: 0 4px 40px rgba(0,0,0,.5);
    position: relative;
  }
  #canvas svg { display: block; width: var(--zoom-width, 900px); height: auto; }

  #empty-hint {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #777; font-size: 14px; pointer-events: none;
    text-align: center; padding: 40px; line-height: 1.7;
  }
  #canvas.has-shapes #empty-hint { display: none; }

  [data-shape-id] { cursor: move; }
  .selected-outline {
    fill: none; stroke: var(--sel); stroke-width: 2;
    stroke-dasharray: 6 4; vector-effect: non-scaling-stroke;
    pointer-events: none;
  }

  #zoom-toolbar {
    position: fixed; left: 20px; top: 20px;
    display: flex; gap: 4px;
    background: rgba(30,30,30,.9); backdrop-filter: blur(10px);
    padding: 6px; border-radius: 6px; border: 1px solid var(--border);
    z-index: 10;
  }
  #zoom-toolbar button {
    background: transparent; border: none; color: var(--ink);
    width: 32px; height: 32px; cursor: pointer;
    font: inherit; font-size: 16px; border-radius: 3px;
  }
  #zoom-toolbar button:hover { background: #333; }
  #zoom-toolbar .zoom-val {
    color: var(--muted); font-size: 11px;
    padding: 0 8px; align-self: center;
    min-width: 40px; text-align: center;
    font-variant-numeric: tabular-nums;
  }

  #sidebar {
    background: var(--panel); border-left: 1px solid var(--border);
    padding: 20px; overflow-y: auto;
  }
  h1 { font-size: 15px; margin: 0 0 4px; letter-spacing: .5px; }
  .subtitle {
    color: var(--muted); font-size: 11px;
    margin-bottom: 24px; letter-spacing: .3px;
  }
  .section {
    margin-bottom: 22px; padding-bottom: 18px;
    border-bottom: 1px solid var(--border);
  }
  .section:last-child { border: none; }
  label {
    display: block; font-size: 11px; text-transform: uppercase;
    letter-spacing: 1px; color: var(--muted); margin-bottom: 8px;
  }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input[type=color] {
    width: 36px; height: 24px; border: 1px solid var(--border);
    background: transparent; cursor: pointer; padding: 2px; border-radius: 3px;
  }
  .row {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 4px;
  }
  .value {
    color: var(--ink); font-variant-numeric: tabular-nums; font-size: 12px;
  }
  button.action, label.action {
    display: block; width: 100%;
    background: transparent; border: 1px solid var(--border);
    color: var(--ink); padding: 10px;
    cursor: pointer; font: inherit;
    border-radius: 3px; margin-top: 6px;
    text-align: center;
    transition: background .1s, border-color .1s;
  }
  button.action:hover, label.action:hover {
    background: #262626; border-color: #444;
  }
  button.action.primary {
    background: var(--accent); border-color: var(--accent);
    color: #000; font-weight: 600;
  }
  button.action.primary:hover { background: #85e6ff; border-color: #85e6ff; }
  button.action.danger { color: #ff6666; }
  button.action.danger:hover { background: #331111; border-color: #663333; color: #ff9999; }
  .hint {
    font-size: 11px; color: var(--muted);
    margin-top: 12px; line-height: 1.5;
  }
  input[type="file"] { display: none; }
  .swatch-row {
    display: grid; grid-template-columns: 1fr auto;
    align-items: center; gap: 8px; margin-bottom: 6px;
  }
  .swatch-row label {
    margin: 0; text-transform: none; letter-spacing: 0;
    color: var(--ink); font-size: 12px;
  }
  select { width: 100%; padding: 6px; background: #111; color: #eee;
           border: 1px solid var(--border); border-radius: 3px; font: inherit; }

  .compass-wrap { display: flex; align-items: center; gap: 16px; margin-top: 4px; }
  #compass { width: 130px; height: 130px; cursor: grab; flex-shrink: 0; }
  #compass.dragging { cursor: grabbing; }
  .compass-meta { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  #compass-deg {
    font-size: 22px; font-variant-numeric: tabular-nums;
    letter-spacing: .5px; color: var(--accent);
  }
  #compass-card { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; }

  #shape-list {
    max-height: 200px; overflow-y: auto; margin-top: 8px;
    border: 1px solid var(--border); border-radius: 3px;
  }
  .shape-row {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; cursor: pointer;
    border-bottom: 1px solid #222;
    font-size: 12px;
  }
  .shape-row:last-child { border-bottom: none; }
  .shape-row:hover { background: #222; }
  .shape-row.selected { background: #2a2a35; color: var(--sel); }
  .shape-thumb {
    width: 32px; height: 32px; background: #333;
    border-radius: 2px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .shape-thumb img, .shape-thumb svg { max-width: 100%; max-height: 100%; }
  .shape-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .shape-del {
    background: none; border: none; color: var(--muted);
    cursor: pointer; padding: 0 4px; font-size: 14px;
  }
  .shape-del:hover { color: #ff6666; }

  #selected-controls {
    display: none;
    margin-top: 10px; padding-top: 12px;
    border-top: 1px dashed #333;
  }
  #selected-controls.on { display: block; }
</style>
</head>
<body>

<div id="canvas-wrap">
  <div id="zoom-toolbar">
    <button id="zoom-out" title="Zoom out">−</button>
    <span class="zoom-val" id="zoom-val">100%</span>
    <button id="zoom-in" title="Zoom in">+</button>
    <button id="zoom-fit" style="width:auto;padding:0 8px;font-size:11px">FIT</button>
    <button id="zoom-100" style="width:auto;padding:0 8px;font-size:11px">1:1</button>
  </div>
  <div id="canvas">
    <div id="empty-hint">
      Add a shape from the sidebar → drop it on the artboard → drag it around<br>
      <span style="color:#555;font-size:12px">
        Wind flows around your shapes in real time. Bring your own SVG or PNG.
      </span>
    </div>
  </div>
</div>

<aside id="sidebar">
  <h1>MUNICH · WIND PLAYGROUND</h1>
  <div class="subtitle">Move obstacles · watch the flow rewire itself</div>

  <div class="section">
    <label>Shapes</label>
    <label class="action" for="file-shape">+ Add shape (SVG / PNG)</label>
    <input type="file" id="file-shape" accept="image/svg+xml,image/png,image/jpeg" multiple />
    <div id="shape-list"></div>

    <div id="selected-controls">
      <div class="row"><label style="margin:0">Scale</label><span class="value" id="sel-scale-val">100</span></div>
      <input type="range" id="sel-scale" min="10" max="500" step="1" value="100"/>

      <div class="row" style="margin-top:10px"><label style="margin:0">Rotation</label><span class="value" id="sel-rot-val">0°</span></div>
      <input type="range" id="sel-rot" min="-180" max="180" step="1" value="0"/>

      <button class="action danger" id="sel-delete">Delete shape</button>
    </div>
  </div>

  <div class="section">
    <label>Wind direction</label>
    <div class="compass-wrap">
      <svg id="compass" viewBox="-50 -50 100 100">
        <circle cx="0" cy="0" r="46" fill="#111" stroke="#333" stroke-width="1"/>
        <g stroke="#333" stroke-width="0.5">
          <line x1="0" y1="-46" x2="0" y2="-42"/>
          <line x1="46" y1="0" x2="42" y2="0"/>
          <line x1="0" y1="46" x2="0" y2="42"/>
          <line x1="-46" y1="0" x2="-42" y2="0"/>
        </g>
        <g fill="#666" font-size="7" font-family="sans-serif" text-anchor="middle">
          <text x="0" y="-32">N</text>
          <text x="32" y="3">E</text>
          <text x="0" y="38">S</text>
          <text x="-32" y="3">W</text>
        </g>
        <g id="compass-needle" transform="rotate(270)">
          <line x1="0" y1="0" x2="0" y2="-38" stroke="#6cf" stroke-width="2.5"/>
          <polygon points="0,-42 -4,-32 4,-32" fill="#6cf"/>
          <circle cx="0" cy="8" r="3" fill="#6cf" opacity="0.5"/>
        </g>
        <circle cx="0" cy="0" r="3" fill="#0a0a0a" stroke="#6cf" stroke-width="1"/>
      </svg>
      <div class="compass-meta">
        <div id="compass-deg">270°</div>
        <div id="compass-card">from West</div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="row"><label style="margin:0">Density</label><span class="value" id="density-val">6000</span></div>
    <input type="range" id="density" min="3000" max="60000" step="500" value="6000" />

    <div class="row" style="margin-top:14px"><label style="margin:0">Arrow size</label><span class="value" id="size-val">22</span></div>
    <input type="range" id="size" min="4" max="80" step="1" value="22" />

    <div class="row" style="margin-top:14px"><label style="margin:0">Stroke thickness</label><span class="value" id="stroke-val">1.5</span></div>
    <input type="range" id="stroke" min="1" max="120" step="1" value="15" />

    <div class="row" style="margin-top:14px"><label style="margin:0">Obstacle deflection</label><span class="value" id="deflect-val">55</span></div>
    <input type="range" id="deflect" min="0" max="100" step="1" value="55" />
  </div>

  <div class="section">
    <label>Arrow glyph</label>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
      <button class="action" id="glyph-default" style="background:var(--accent);color:#000;font-weight:600;border-color:var(--accent);margin-top:0">Arrow</button>
      <button class="action" id="glyph-logo" style="margin-top:0">Custom</button>
    </div>
    <label class="action" for="file-logo">Load logo (SVG / PNG)</label>
    <input type="file" id="file-logo" accept="image/svg+xml,image/png,image/jpeg" />
  </div>

  <div class="section">
    <label>Colour</label>
    <div class="swatch-row"><label>Arrow colour</label><input type="color" id="c-arrow" value="#000000"></div>
    <div class="swatch-row"><label>Base background</label><input type="color" id="c-bg" value="#f2f2f0"></div>

    <label style="margin-top:14px">Density → colour harmony</label>
    <select id="harmony">
      <option value="none">None (flat background)</option>
      <option value="mono">Monochrome</option>
      <option value="analogous">Analogous</option>
      <option value="complementary">Complementary</option>
      <option value="split">Split-complementary</option>
      <option value="triad">Triadic</option>
      <option value="tetrad">Tetradic</option>
    </select>

    <div class="row" style="margin-top:12px"><label style="margin:0">Harmony intensity</label><span class="value" id="harmony-int-val">70</span></div>
    <input type="range" id="harmony-intensity" min="0" max="100" step="1" value="70"/>
  </div>

  <div class="section">
    <button class="action" id="reseed">Re-sample arrows</button>
    <button class="action" id="reset">Reset all</button>
  </div>

  <div class="section">
    <button class="action primary" id="export-svg">Export SVG</button>
  </div>
</aside>

<script>
const SVG_NS = "http://www.w3.org/2000/svg";
const XLINK_NS = "http://www.w3.org/1999/xlink";
const canvas = document.getElementById("canvas");
const canvasWrap = document.getElementById("canvas-wrap");

let svgEl = null;
let bgColorLayer = null;
let shapesG = null;         // shape rendering
let arrowsG = null;
let selectionG = null;      // dashed selection outline

let viewBox = { x: 0, y: 0, w: 1600, h: 1000 };
let seed = 1;
let flow = null;

let shapes = [];            // { id, name, href, silhouette, x, y, scale, angle, w, h }
let selectedId = null;
let shapeCounter = 0;

let windDirection = 270;
let arrowStyle = "default";
let logoSymbol = null;

// -------- SVG scaffolding --------
function buildSvg() {
  svgEl = document.createElementNS(SVG_NS, "svg");
  svgEl.setAttribute("viewBox", `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`);
  svgEl.setAttribute("xmlns", SVG_NS);
  svgEl.setAttribute("xmlns:xlink", XLINK_NS);
  svgEl.setAttribute("preserveAspectRatio", "xMidYMid meet");

  const defs = document.createElementNS(SVG_NS, "defs");
  svgEl.appendChild(defs);

  bgColorLayer = document.createElementNS(SVG_NS, "g");
  bgColorLayer.setAttribute("id", "bg-color");
  svgEl.appendChild(bgColorLayer);

  arrowsG = document.createElementNS(SVG_NS, "g");
  arrowsG.setAttribute("id", "arrows");
  svgEl.appendChild(arrowsG);

  shapesG = document.createElementNS(SVG_NS, "g");
  shapesG.setAttribute("id", "shapes");
  svgEl.appendChild(shapesG);

  selectionG = document.createElementNS(SVG_NS, "g");
  selectionG.setAttribute("id", "selection");
  svgEl.appendChild(selectionG);

  canvas.appendChild(svgEl);
}

// -------- PRNG --------
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// -------- colour utilities --------
function hexToRgb(hex) {
  hex = hex.replace("#", "");
  if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
  return [parseInt(hex.slice(0,2),16), parseInt(hex.slice(2,4),16), parseInt(hex.slice(4,6),16)];
}
function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b);
  let h = 0, s = 0, l = (mx + mn) / 2;
  if (mx !== mn) {
    const d = mx - mn;
    s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
    switch (mx) {
      case r: h = (g - b) / d + (g < b ? 6 : 0); break;
      case g: h = (b - r) / d + 2; break;
      case b: h = (r - g) / d + 4; break;
    }
    h *= 60;
  }
  return [h, s, l];
}
function hslToRgb(h, s, l) {
  h = ((h % 360) + 360) % 360;
  s = Math.max(0, Math.min(1, s));
  l = Math.max(0, Math.min(1, l));
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
  const m = l - c / 2;
  let r, g, b;
  if (h < 60)      [r, g, b] = [c, x, 0];
  else if (h < 120)[r, g, b] = [x, c, 0];
  else if (h < 180)[r, g, b] = [0, c, x];
  else if (h < 240)[r, g, b] = [0, x, c];
  else if (h < 300)[r, g, b] = [x, 0, c];
  else             [r, g, b] = [c, 0, x];
  return [(r + m) * 255, (g + m) * 255, (b + m) * 255];
}
function harmonyStops(baseHex, kind) {
  const [r0, g0, b0] = hexToRgb(baseHex);
  const [h, s, l] = rgbToHsl(r0, g0, b0);
  const at = (dh, ds = 0, dl = 0) =>
    hslToRgb(h + dh, Math.max(0.15, Math.min(1, s + ds)), Math.max(0.1, Math.min(0.95, l + dl)));
  const base = [r0, g0, b0];
  switch (kind) {
    case "mono":          return [base, at(0, 0, -0.35)];
    case "analogous":     return [base, at(-30), at(30)];
    case "complementary": return [base, at(180)];
    case "split":         return [base, at(150), at(210)];
    case "triad":         return [base, at(120), at(240)];
    case "tetrad":        return [base, at(90), at(180), at(270)];
    default:              return [base];
  }
}
function interpPalette(stops, t) {
  if (stops.length === 1) return stops[0];
  const scaled = t * (stops.length - 1);
  const i = Math.floor(scaled);
  const f = scaled - i;
  if (i >= stops.length - 1) return stops[stops.length - 1];
  const a = stops[i], b = stops[i + 1];
  return [a[0] + (b[0]-a[0])*f, a[1] + (b[1]-a[1])*f, a[2] + (b[2]-a[2])*f];
}

// -------- shape loading --------
async function loadShapeFile(file) {
  const isSvg = file.type === "image/svg+xml" || file.name.toLowerCase().endsWith(".svg");
  let href, silhouette, w, h;

  if (isSvg) {
    const text = await file.text();
    const doc = new DOMParser().parseFromString(text, "image/svg+xml");
    const src = doc.documentElement;
    let vb = src.getAttribute("viewBox");
    if (!vb) {
      const sw = parseFloat(src.getAttribute("width")) || 200;
      const sh = parseFloat(src.getAttribute("height")) || 200;
      vb = `0 0 ${sw} ${sh}`;
    }
    const [_, __, sw, sh] = vb.split(/[\s,]+/).map(parseFloat);
    w = sw; h = sh;
    href = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(text)));

    // Silhouette: black-forced version of the SVG
    const silhouetteSvg =
      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}" width="${w}" height="${h}">` +
      `<style>* { fill: black !important; stroke: black !important; }</style>` +
      src.innerHTML +
      `</svg>`;
    silhouette = await svgToCanvas(silhouetteSvg, w, h);
  } else {
    const blob = new Blob([await file.arrayBuffer()], { type: file.type });
    href = URL.createObjectURL(blob);
    const img = new Image();
    img.src = href;
    await img.decode();
    w = img.naturalWidth; h = img.naturalHeight;
    silhouette = imageToSilhouette(img);
  }

  const shape = {
    id: shapeCounter++,
    name: file.name,
    href, silhouette,
    x: viewBox.w / 2,   // spawn near centre
    y: viewBox.h / 2,
    scale: Math.min(1, viewBox.w * 0.25 / w),   // shrink big shapes on entry
    angle: 0,
    w, h,
  };
  shapes.push(shape);
  selectedId = shape.id;
  renderShapes();
  renderShapeList();
  renderSelection();
  render();
}

async function svgToCanvas(svgText, w, h) {
  const blob = new Blob([svgText], { type: "image/svg+xml" });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.src = url;
  await img.decode();
  URL.revokeObjectURL(url);
  const c = document.createElement("canvas");
  c.width = Math.max(2, Math.round(w));
  c.height = Math.max(2, Math.round(h));
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c;
}

function imageToSilhouette(img) {
  const c = document.createElement("canvas");
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  const ctx = c.getContext("2d");
  ctx.drawImage(img, 0, 0);
  const d = ctx.getImageData(0, 0, c.width, c.height);
  for (let i = 0; i < d.data.length; i += 4) {
    // Treat any non-transparent, non-white pixel as obstacle.
    const a = d.data[i + 3];
    const lum = 0.299 * d.data[i] + 0.587 * d.data[i+1] + 0.114 * d.data[i+2];
    const isDark = a > 30 && lum < 200;
    d.data[i] = 0; d.data[i+1] = 0; d.data[i+2] = 0;
    d.data[i+3] = isDark ? 255 : 0;
  }
  ctx.putImageData(d, 0, 0);
  return c;
}

// -------- shape rendering --------
function renderShapes() {
  shapesG.innerHTML = "";
  for (const s of shapes) {
    const g = document.createElementNS(SVG_NS, "g");
    g.setAttribute("data-shape-id", s.id);
    g.setAttribute("transform",
      `translate(${s.x} ${s.y}) rotate(${s.angle}) scale(${s.scale})`);
    const img = document.createElementNS(SVG_NS, "image");
    img.setAttribute("x", -s.w / 2);
    img.setAttribute("y", -s.h / 2);
    img.setAttribute("width", s.w);
    img.setAttribute("height", s.h);
    img.setAttributeNS(XLINK_NS, "xlink:href", s.href);
    img.setAttribute("href", s.href);
    img.setAttribute("preserveAspectRatio", "none");
    g.appendChild(img);
    shapesG.appendChild(g);
  }
  canvas.classList.toggle("has-shapes", shapes.length > 0);
}

function renderShapeList() {
  const list = document.getElementById("shape-list");
  list.innerHTML = "";
  for (const s of shapes) {
    const row = document.createElement("div");
    row.className = "shape-row" + (s.id === selectedId ? " selected" : "");
    row.innerHTML =
      `<div class="shape-thumb"><img src="${s.href}"/></div>` +
      `<div class="shape-name">${s.name}</div>` +
      `<button class="shape-del" title="Delete">×</button>`;
    row.addEventListener("click", e => {
      if (e.target.classList.contains("shape-del")) return;
      selectShape(s.id);
    });
    row.querySelector(".shape-del").addEventListener("click", e => {
      e.stopPropagation();
      deleteShape(s.id);
    });
    list.appendChild(row);
  }
  document.getElementById("selected-controls").classList.toggle("on", selectedId !== null);
  if (selectedId !== null) {
    const s = shapes.find(x => x.id === selectedId);
    if (s) {
      document.getElementById("sel-scale").value = Math.round(s.scale * 100);
      document.getElementById("sel-scale-val").textContent = Math.round(s.scale * 100);
      document.getElementById("sel-rot").value = Math.round(s.angle);
      document.getElementById("sel-rot-val").textContent = Math.round(s.angle) + "°";
    }
  }
}

function renderSelection() {

  g.setAttribute("transform",
    `translate(${s.x} ${s.y}) rotate(${s.angle}) scale(${s.scale})`);
  g.appendChild(rect);

}

function deleteShape(id) {

  renderShapes();
  renderShapeList();
  renderSelection();
  render();
}

// -------- flow field from shapes --------
function computeFlowField() {
  if (shapes.length === 0) { flow = null; return; }
  const long = 500;
  const aspect = viewBox.w / viewBox.h;
  const W = aspect >= 1 ? long : Math.round(long * aspect);
  const H = aspect >= 1 ? Math.round(long / aspect) : long;

  const off = document.createElement("canvas");
  off.width = W; off.height = H;
  const ctx = off.getContext("2d");
  ctx.fillStyle = "white";
  ctx.fillRect(0, 0, W, H);

  const kx = W / viewBox.w, ky = H / viewBox.h;
  for (const s of shapes) {
    ctx.save();
    ctx.translate((s.x - viewBox.x) * kx, (s.y - viewBox.y) * ky);
    ctx.rotate(s.angle * Math.PI / 180);
    ctx.scale(s.scale * kx, s.scale * ky);
    ctx.drawImage(s.silhouette, -s.w / 2, -s.h / 2);
    ctx.restore();
  }

  const data = ctx.getImageData(0, 0, W, H).data;
  const weight = new Float32Array(W * H);
  const mask   = new Uint8Array(W * H);
  for (let i = 0, j = 0; j < weight.length; i += 4, j++) {
    const lum = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
    const a = data[i+3] / 255;
    const w = a * (1 - lum / 255);
    weight[j] = w;
    mask[j] = w > 0.15 ? 1 : 0;
  }
  const dist = distanceTransform(mask, W, H);
  flow = { weight, mask, dist, W, H };
}

function distanceTransform(mask, W, H) {
  const INF = 1e9, D1 = 1, D2 = Math.SQRT2;
  const d = new Float32Array(W * H);
  for (let i = 0; i < mask.length; i++) d[i] = mask[i] ? 0 : INF;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x;
    let v = d[i];
    if (x > 0)              v = Math.min(v, d[i - 1] + D1);
    if (y > 0)              v = Math.min(v, d[i - W] + D1);
    if (x > 0 && y > 0)     v = Math.min(v, d[i - W - 1] + D2);
    if (x < W - 1 && y > 0) v = Math.min(v, d[i - W + 1] + D2);
    d[i] = v;
  }
  for (let y = H - 1; y >= 0; y--) for (let x = W - 1; x >= 0; x--) {
    const i = y * W + x;
    let v = d[i];
    if (x < W - 1)              v = Math.min(v, d[i + 1] + D1);
    if (y < H - 1)              v = Math.min(v, d[i + W] + D1);
    if (x > 0 && y < H - 1)     v = Math.min(v, d[i + W - 1] + D2);
    if (x < W - 1 && y < H - 1) v = Math.min(v, d[i + W + 1] + D2);
    d[i] = v;
  }
  return d;
}

function boxBlur(src, W, H, r) {
  if (r < 1) return new Float32Array(src);
  const tmp = new Float32Array(W * H);
  const out = new Float32Array(W * H);
  const inv = 1 / (2 * r + 1);
  for (let y = 0; y < H; y++) {
    let sum = 0;
    for (let x = -r; x <= r; x++) sum += src[y * W + Math.max(0, Math.min(W - 1, x))];
    for (let x = 0; x < W; x++) {
      tmp[y * W + x] = sum * inv;
      sum -= src[y * W + Math.max(0, x - r)];
      sum += src[y * W + Math.min(W - 1, x + r + 1)];
    }
  }
  for (let x = 0; x < W; x++) {
    let sum = 0;
    for (let y = -r; y <= r; y++) sum += tmp[Math.max(0, Math.min(H - 1, y)) * W + x];
    for (let y = 0; y < H; y++) {
      out[y * W + x] = sum * inv;
      sum -= tmp[Math.max(0, y - r) * W + x];
      sum += tmp[Math.min(H - 1, y + r + 1) * W + x];
    }
  }
  return out;
}

function sampleFlow(px, py, baseX, baseY) {
  if (!flow) return { wx: baseX, wy: baseY, alpha: 1, inside: false };
  const { weight, dist, W, H } = flow;
  const fx = (px - viewBox.x) / viewBox.w * W;
  const fy = (py - viewBox.y) / viewBox.h * H;
  const ix = Math.max(0, Math.min(W - 1, Math.round(fx)));
  const iy = Math.max(0, Math.min(H - 1, Math.round(fy)));
  const i0 = iy * W + ix;
  const w0 = weight[i0];
  if (w0 > 0.65) return { wx: 0, wy: 0, alpha: 0, inside: true };
  const alpha = 1 - w0 * 0.85;

  const long = Math.max(W, H);
  const deflect = +document.getElementById("deflect").value;
  const range = deflect / 100 * long * 0.4;
  const d = dist[i0];
  if (range <= 0 || d >= range) return { wx: baseX, wy: baseY, alpha, inside: false };

  const ixm = Math.max(0, ix - 1), ixp = Math.min(W - 1, ix + 1);
  const iym = Math.max(0, iy - 1), iyp = Math.min(H - 1, iy + 1);
  const gx = dist[iy * W + ixp] - dist[iy * W + ixm];
  const gy = dist[iyp * W + ix] - dist[iym * W + ix];
  const glen = Math.hypot(gx, gy);
  if (glen < 1e-6) return { wx: baseX, wy: baseY, alpha, inside: false };
  const gxn = gx / glen, gyn = gy / glen;
  let tx = -gyn, ty = gxn;
  if (tx * baseX + ty * baseY < 0) { tx = -tx; ty = -ty; }
  const t = 1 - d / range;
  const influence = t * t;
  const rx = baseX * (1 - influence) + tx * influence;
  const ry = baseY * (1 - influence) + ty * influence;
  const rlen = Math.hypot(rx, ry) || 1;
  return { wx: rx / rlen, wy: ry / rlen, alpha, inside: false };
}

// -------- density → colour background --------
function renderColorBg() {
  const harmony = document.getElementById("harmony").value;
  const baseHex = document.getElementById("c-bg").value;
  const intensity = +document.getElementById("harmony-intensity").value / 100;
  document.getElementById("harmony-int-val").textContent =
    document.getElementById("harmony-intensity").value;
  canvas.style.background = baseHex;
  if (!svgEl) return;
  svgEl.style.background = baseHex;
  if (harmony === "none" || intensity === 0 || !flow) {
    bgColorLayer.innerHTML = "";
    return;
  }
  const { dist, weight, W, H } = flow;
  const long = Math.max(W, H);
  const RANGE = long * 0.35;
  const raw = new Float32Array(W * H);
  for (let i = 0; i < W * H; i++) {
    const d = dist[i];
    let v = d < RANGE ? 1 - d / RANGE : 0;
    v = v * v;
    if (weight[i] > 0.65) v = 1;
    raw[i] = v;
  }
  const smooth = boxBlur(raw, W, H, Math.max(2, Math.round(long * 0.02)));
  const stops = harmonyStops(baseHex, harmony);
  const [rB, gB, bB] = hexToRgb(baseHex);
  const off = document.createElement("canvas");
  off.width = W; off.height = H;
  const ctx = off.getContext("2d");
  const img = ctx.createImageData(W, H);
  for (let i = 0, j = 0; i < W * H; i++, j += 4) {
    const t = smooth[i];
    const [r, g, b] = interpPalette(stops, t);
    img.data[j]     = rB + (r - rB) * intensity;
    img.data[j + 1] = gB + (g - gB) * intensity;
    img.data[j + 2] = bB + (b - bB) * intensity;
    img.data[j + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  bgColorLayer.innerHTML =
    `<image x="${viewBox.x}" y="${viewBox.y}" width="${viewBox.w}" height="${viewBox.h}" ` +
    `preserveAspectRatio="none" href="${off.toDataURL()}"/>`;
}

// -------- arrow point placement --------
function fromDegToScreenVec(fromDeg) {
  const rad = (fromDeg + 90) * Math.PI / 180;
  return { x: Math.cos(rad), y: Math.sin(rad) };
}
function generateArrowPoints(N, rand) {
  const pts = [];
  if (!flow) {
    const aspect = viewBox.w / viewBox.h;
    const cols = Math.max(1, Math.round(Math.sqrt(N * aspect)));
    const rows = Math.max(1, Math.round(N / cols));
    const cellW = viewBox.w / cols, cellH = viewBox.h / rows;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const jx = (rand() - 0.5) * cellW * 0.6;
      const jy = (rand() - 0.5) * cellH * 0.6;
      pts.push({
        x: (c + 0.5) * cellW + jx + viewBox.x,
        y: (r + 0.5) * cellH + jy + viewBox.y,
      });
    }
    return pts;
  }
  const { weight, dist, W, H } = flow;
  const cellW = viewBox.w / W, cellH = viewBox.h / H;
  const long = Math.max(W, H);
  const BOOST_RANGE = long * 0.12, BOOST_MAX = 3.5;
  let totalImp = 0;
  const imp = new Float32Array(W * H);
  for (let i = 0; i < W * H; i++) {
    if (weight[i] > 0.65) { imp[i] = 0; continue; }
    const d = dist[i];
    const boost = d < BOOST_RANGE
      ? 1 + BOOST_MAX * (1 - d / BOOST_RANGE) * (1 - d / BOOST_RANGE) : 1;
    imp[i] = boost;
    totalImp += imp[i];
  }
  if (totalImp === 0) return pts;
  const scale = N / totalImp;
  for (let i = 0; i < imp.length; i++) {
    const expected = imp[i] * scale;
    if (expected < 0.001) continue;
    const count = Math.floor(expected + rand());
    if (count === 0) continue;
    const cx = i % W, cy = (i / W) | 0;
    for (let k = 0; k < count; k++) {
      pts.push({
        x: (cx + rand()) * cellW + viewBox.x,
        y: (cy + rand()) * cellH + viewBox.y,
      });
    }
  }
  return pts;
}

// -------- render --------
function render() {
  if (!svgEl) return;
  const density = +document.getElementById("density").value;
  const size    = +document.getElementById("size").value;
  const stroke  = +document.getElementById("stroke").value / 10;
  const deflect = +document.getElementById("deflect").value;
  const arrowC  = document.getElementById("c-arrow").value;
  document.getElementById("density-val").textContent = density;
  document.getElementById("size-val").textContent = size;
  document.getElementById("stroke-val").textContent = stroke.toFixed(1);
  document.getElementById("deflect-val").textContent = deflect;

  renderColorBg();

  const rand = mulberry32(seed);
  const points = generateArrowPoints(density, rand);
  const base = fromDegToScreenVec(windDirection);

  const useLogo = arrowStyle === "logo" && logoSymbol;
  const logoScale = useLogo ? size / logoSymbol.h : 1;
  const logoOffX = useLogo ? -logoSymbol.w / 2 : 0;
  const logoOffY = useLogo ? -logoSymbol.h / 2 : 0;

  let svgFrag = "";
  for (let p = 0; p < points.length; p++) {
    const cx = points[p].x, cy = points[p].y;
    const f = sampleFlow(cx, cy, base.x, base.y);
    if (f.inside) continue;
    const op = f.alpha < 0.99 ? ` opacity="${f.alpha.toFixed(2)}"` : "";
    if (useLogo) {
      const rotDeg = (Math.atan2(f.wx, -f.wy) * 180 / Math.PI).toFixed(1);
      svgFrag +=
        `<use href="#user-logo" transform="translate(${cx.toFixed(1)} ${cy.toFixed(1)}) ` +
        `rotate(${rotDeg}) scale(${logoScale.toFixed(3)}) ` +
        `translate(${logoOffX} ${logoOffY})"${op}/>`;
    } else {
      const half = size * 0.5;
      const headLen = size * 0.22;
      const headHalfW = size * 0.11;
      const flowX = f.wx, flowY = f.wy;
      const perpX = -flowY, perpY = flowX;
      const tailX = cx - flowX * half, tailY = cy - flowY * half;
      const tipX = cx + flowX * half, tipY = cy + flowY * half;
      const wingBaseX = tipX - flowX * headLen, wingBaseY = tipY - flowY * headLen;
      const w1X = wingBaseX + perpX * headHalfW, w1Y = wingBaseY + perpY * headHalfW;
      const w2X = wingBaseX - perpX * headHalfW, w2Y = wingBaseY - perpY * headHalfW;
      const d = `M${tailX.toFixed(1)} ${tailY.toFixed(1)}L${tipX.toFixed(1)} ${tipY.toFixed(1)}` +
                `M${w1X.toFixed(1)} ${w1Y.toFixed(1)}L${tipX.toFixed(1)} ${tipY.toFixed(1)}L${w2X.toFixed(1)} ${w2Y.toFixed(1)}`;
      svgFrag += `<path d="${d}" fill="none" stroke="${arrowC}" stroke-width="${stroke}"${op} stroke-linecap="butt" stroke-linejoin="miter"/>`;
    }
  }
  arrowsG.innerHTML = svgFrag;
}

// Called whenever shapes move / add / delete / resize.
function rebuildAndRender() {
  computeFlowField();
  render();
  renderShapes();
  renderSelection();
}

// -------- shape drag / pan --------
function screenToViewBox(clientX, clientY) {
  const rect = svgEl.getBoundingClientRect();
  const vx = viewBox.x + (clientX - rect.left) / rect.width * viewBox.w;
  const vy = viewBox.y + (clientY - rect.top) / rect.height * viewBox.h;
  return { x: vx, y: vy };
}

let dragShape = null;
let panStart = null;

canvasWrap.addEventListener("mousedown", e => {
  if (e.button !== 0) return;
  const shapeEl = e.target.closest("[data-shape-id]");
  if (shapeEl) {
    const id = +shapeEl.getAttribute("data-shape-id");
    const s = shapes.find(x => x.id === id);
    if (!s) return;
    const pt = screenToViewBox(e.clientX, e.clientY);
    dragShape = { id, offsetX: pt.x - s.x, offsetY: pt.y - s.y };
    selectShape(id);
    canvasWrap.classList.add("shape-drag");
    e.preventDefault();
  } else if (e.target.closest("#zoom-toolbar")) {
    return;
  } else {
    panStart = { x: e.clientX, y: e.clientY,
                 sl: canvasWrap.scrollLeft, st: canvasWrap.scrollTop };
    canvasWrap.classList.add("dragging");
    if (selectedId !== null) selectShape(null);
  }
});

window.addEventListener("mousemove", e => {
  if (dragShape) {
    const s = shapes.find(x => x.id === dragShape.id);
    if (!s) return;
    const pt = screenToViewBox(e.clientX, e.clientY);
    s.x = pt.x - dragShape.offsetX;
    s.y = pt.y - dragShape.offsetY;
    // Immediate visual update; recompute flow field on animation frame.
    scheduleRebuild();
  } else if (panStart) {
    canvasWrap.scrollLeft = panStart.sl - (e.clientX - panStart.x);
    canvasWrap.scrollTop  = panStart.st - (e.clientY - panStart.y);
  }
});

window.addEventListener("mouseup", () => {
  if (dragShape) {
    dragShape = null;
    canvasWrap.classList.remove("shape-drag");
    scheduleRebuild(true);   // final refresh
  }
  panStart = null;
  canvasWrap.classList.remove("dragging");
});

let rebuildRaf = null;
function scheduleRebuild() {
  if (rebuildRaf) return;
  rebuildRaf = requestAnimationFrame(() => {
    rebuildRaf = null;
    rebuildAndRender();
  });
}

window.addEventListener("keydown", e => {
  if (e.key === "Delete" || e.key === "Backspace") {
    if (selectedId !== null && !isTypingTarget(e.target)) {
      deleteShape(selectedId);
      e.preventDefault();
    }
  } else if (e.key === "Escape") {
    if (selectedId !== null) selectShape(null);
  }
});
function isTypingTarget(t) {
  return t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT");
}

// -------- compass --------
const compassEl = document.getElementById("compass");
const compassNeedle = document.getElementById("compass-needle");
const compassDeg = document.getElementById("compass-deg");
const compassCard = document.getElementById("compass-card");

function degToCardinal(deg) {
  const dirs = ["N","NNE","NE","ENE","E","ESE","SE","SSE",
                "S","SSW","SW","WSW","W","WNW","NW","NNW"];
  return dirs[Math.round(deg / 22.5) % 16];
}
function setWindDirection(deg) {
  deg = ((deg % 360) + 360) % 360;
  windDirection = deg;
  compassNeedle.setAttribute("transform", `rotate(${deg})`);
  compassDeg.textContent = Math.round(deg) + "°";
  compassCard.textContent = "from " + degToCardinal(deg);
  render();
}
let compassDragging = false;
function angleFromCompass(evt) {
  const rect = compassEl.getBoundingClientRect();
  const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
  let deg = Math.atan2(evt.clientX - cx, -(evt.clientY - cy)) * 180 / Math.PI;
  if (deg < 0) deg += 360;
  return deg;
}
compassEl.addEventListener("mousedown", e => {
  compassDragging = true;
  compassEl.classList.add("dragging");
  setWindDirection(angleFromCompass(e));
  e.preventDefault(); e.stopPropagation();
});
window.addEventListener("mousemove", e => {
  if (compassDragging) setWindDirection(angleFromCompass(e));
});
window.addEventListener("mouseup", () => {
  compassDragging = false;
  compassEl.classList.remove("dragging");
});

// -------- logo (arrow glyph) --------
async function loadLogo(file) {
  const isSvg = file.type === "image/svg+xml" || file.name.toLowerCase().endsWith(".svg");
  let sym = svgEl.querySelector("#user-logo");
  if (sym) sym.remove();
  sym = document.createElementNS(SVG_NS, "symbol");
  sym.setAttribute("id", "user-logo");
  sym.setAttribute("overflow", "visible");
  let w, h;
  if (isSvg) {
    const text = await file.text();
    const doc = new DOMParser().parseFromString(text, "image/svg+xml");
    const src = doc.documentElement;
    let vb = src.getAttribute("viewBox");
    if (!vb) {
      const sw = parseFloat(src.getAttribute("width")) || 100;
      const sh = parseFloat(src.getAttribute("height")) || 100;
      vb = `0 0 ${sw} ${sh}`;
    }
    const parts = vb.split(/[\s,]+/).map(parseFloat);
    w = parts[2]; h = parts[3];
    sym.setAttribute("viewBox", vb);
    Array.from(src.children).forEach(c => sym.appendChild(c.cloneNode(true)));
  } else {
    const blob = new Blob([await file.arrayBuffer()], { type: file.type });
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.src = url; await img.decode();
    w = img.naturalWidth; h = img.naturalHeight;
    sym.setAttribute("viewBox", `0 0 ${w} ${h}`);
    const imgEl = document.createElementNS(SVG_NS, "image");
    imgEl.setAttribute("x", 0); imgEl.setAttribute("y", 0);
    imgEl.setAttribute("width", w); imgEl.setAttribute("height", h);
    imgEl.setAttributeNS(XLINK_NS, "xlink:href", url);
    imgEl.setAttribute("href", url);
    sym.appendChild(imgEl);
  }
  svgEl.querySelector("defs").appendChild(sym);
  logoSymbol = { id: "user-logo", w, h };
  setArrowStyle("logo");
}
function setArrowStyle(style) {
  arrowStyle = style === "logo" && logoSymbol ? "logo" : "default";
  const set = (id, active) => {
    const b = document.getElementById(id);
    b.style.background = active ? "var(--accent)" : "transparent";
    b.style.color = active ? "#000" : "var(--ink)";
    b.style.borderColor = active ? "var(--accent)" : "var(--border)";
  };
  set("glyph-default", arrowStyle === "default");
  set("glyph-logo", arrowStyle === "logo");
  render();
}
document.getElementById("glyph-default").addEventListener("click", () => setArrowStyle("default"));
document.getElementById("glyph-logo").addEventListener("click", () => setArrowStyle("logo"));
document.getElementById("file-logo").addEventListener("change", async e => {
  const f = e.target.files[0]; if (f) await loadLogo(f);
});

document.getElementById("export-svg").addEventListener("click", () => {
  const clone = svgEl.cloneNode(true);

  const sel = clone.querySelector("#selection");

  clone.style.background = document.getElementById("c-bg").value;
  const bg = document.createElementNS(SVG_NS, "rect");
  bg.setAttribute("x", viewBox.x); bg.setAttribute("y", viewBox.y);
  bg.setAttribute("width", viewBox.w); bg.setAttribute("height", viewBox.h);
  bg.setAttribute("fill", document.getElementById("c-bg").value);
  clone.insertBefore(bg, clone.firstChild.nextSibling);
  const source = new XMLSerializer().serializeToString(clone);
  const blob = new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n', source],
                        { type: "image/svg+xml" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `munich_playground_${Math.round(windDirection)}deg_${Date.now()}.svg`;
  a.click();
  URL.revokeObjectURL(url);
});

// -------- zoom & pan --------
let currentZoom = 1;
let naturalW = 900;
const zoomValEl = document.getElementById("zoom-val");
function applyZoom() {
  canvas.style.setProperty("--zoom-width", (naturalW * currentZoom) + "px");
  zoomValEl.textContent = Math.round(currentZoom * 100) + "%";
}
function fitToScreen() {
  if (!svgEl) return;
  const aspect = viewBox.w / viewBox.h;
  const availW = Math.max(400, canvasWrap.clientWidth - 48);
  const availH = Math.max(400, canvasWrap.clientHeight - 48);
  naturalW = Math.max(300, Math.min(availH * aspect, availW));
  currentZoom = 1;
  applyZoom();
}
document.getElementById("zoom-in").addEventListener("click", () => {
  currentZoom = Math.min(8, currentZoom * 1.25); applyZoom();
});
document.getElementById("zoom-out").addEventListener("click", () => {
  currentZoom = Math.max(0.2, currentZoom / 1.25); applyZoom();
});
document.getElementById("zoom-fit").addEventListener("click", fitToScreen);
document.getElementById("zoom-100").addEventListener("click", () => {
  naturalW = viewBox.w; currentZoom = 1; applyZoom();
});
canvasWrap.addEventListener("wheel", e => {
  e.preventDefault();
  const rect = canvasWrap.getBoundingClientRect();
  const cx = e.clientX - rect.left + canvasWrap.scrollLeft;
  const cy = e.clientY - rect.top  + canvasWrap.scrollTop;
  const before = currentZoom;
  const delta = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  currentZoom = Math.max(0.2, Math.min(8, currentZoom * delta));
  applyZoom();
  const ratio = currentZoom / before;
  canvasWrap.scrollLeft = cx * ratio - (e.clientX - rect.left);
  canvasWrap.scrollTop  = cy * ratio - (e.clientY - rect.top);
}, { passive: false });
window.addEventListener("resize", () => svgEl && fitToScreen());

// -------- boot --------
buildSvg();
render();
requestAnimationFrame(() => requestAnimationFrame(fitToScreen));
</script>
