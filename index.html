<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Munich · Data Viz Studio</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; background: #0a0a0a; color: #eee;
               font: 12px/1.4 -apple-system, "Helvetica Neue", sans-serif; }
  body { display: flex; flex-direction: column; }
  #tabs {
    display: flex;
    background: #050505;
    border-bottom: 1px solid #222;
    padding: 6px 6px 0 6px;
    gap: 4px;
    flex-shrink: 0;
  }
  #tabs .brand {
    padding: 8px 14px;
    color: #666;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    align-self: center;
    margin-right: 10px;
    border-right: 1px solid #222;
  }
  #tabs button {
    background: #1a1a1a;
    border: 1px solid #222;
    border-bottom: none;
    color: #999;
    padding: 8px 16px;
    cursor: pointer;
    font: inherit;
    letter-spacing: .3px;
    border-radius: 6px 6px 0 0;
    position: relative;
    top: 1px;
    transition: color .1s, background .1s;
  }
  #tabs button:hover { color: #fff; background: #222; }
  #tabs button.active {
    background: #1b1b1b;
    color: #fff;
    border-color: #2a2a2a;
  }
  #tabs button.active::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -1px; height: 1px;
    background: #1b1b1b;
  }
  #frames { flex: 1; position: relative; background: #0a0a0a; }
  iframe {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    border: 0;
    display: none;
  }
  iframe.active { display: block; }
</style>
</head>
<body>

<nav id="tabs">
  <div class="brand">MUNICH · DATA VIZ STUDIO</div>
  <button class="active" data-src="glitch.html">Glitch Studio</button>
  <button data-src="wind.html">Wind Field</button>
  <button data-src="playground.html">Playground</button>
</nav>

<div id="frames">
  <iframe id="frame-glitch" class="active" src="glitch.html"></iframe>
  <iframe id="frame-wind" src="wind.html"></iframe>
  <iframe id="frame-playground" src="playground.html"></iframe>
</div>

<script>
  const buttons = document.querySelectorAll("#tabs button");
  const frames  = document.querySelectorAll("iframe");
  buttons.forEach(btn => btn.addEventListener("click", () => {
    buttons.forEach(b => b.classList.toggle("active", b === btn));
    const target = btn.dataset.src;
    frames.forEach(f => {
      f.classList.toggle("active", f.getAttribute("src") === target);
    });
  }));
</script>
</body>
</html>
